<!DOCTYPE html>
<html>
<head>
    <title>jQuery Advanced - Multiple CSS Properties</title>
    <script src="https://code.jquery.com/jquery-3.6.1.min.js"></script>
    <style>
        #div1 {
            width: 100px;
            height: 100px;
            background: yellow;
            position: relative;
        }
    </style>
    <script>
        $(document).ready(function () {
            $("#b1").click(function () {
                $("#div1").animate({
                    width: "150px",
                    height: "150px",
                    opacity: "0.5",
                    left: "150px"
                });
            });
        });
    </script>
</head>
<body>
    <p>Animation</p>
    <div id="div1"></div><br>
    <button id="b1">Click to Animate</button>
</body>
</html>
