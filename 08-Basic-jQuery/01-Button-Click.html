<!DOCTYPE html>
<html>
<head>
    <title>Basic jQuery - Button Click</title>
    <script src="https://code.jquery.com/jquery-3.6.1.min.js"></script>
    <script>
        $(document).ready(function () {
            $("#btn").click(function () {
                document.write("Hello Romal");
            });
        });
    </script>
</head>
<body>
    <p>Romal: 239720</p>
    <button id="btn">Click Me</button>
</body>
</html>
