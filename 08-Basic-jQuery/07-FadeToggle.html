<!DOCTYPE html>
<html>
<head>
    <title>Basic jQuery - Fade Toggle</title>
    <script src="https://code.jquery.com/jquery-3.6.1.min.js"></script>
    <script>
        $(document).ready(function () {
            $("button").click(function () {
                $("#p").fadeToggle(5000);
            });
        });
    </script>
</head>
<body>
    <p id="p">Romal Shah: 239720</p>
    <button>Fade Toggle</button>
</body>
</html>
